            <h1>Midjourney 提示詞技巧</h1>
            <p>學習提示詞結構、常用參數與圖像生成範例。</p>
        </header>

        <main class="card">
            <h2>提示詞基本結構</h2>
            <p>[主題描述] + [環境與風格] + [視角與燈光] + [參數設定]</p>
            
            <h2 style="margin-top: 1.5rem;">常用參數參考</h2>
            <p>• <code>--ar 16:9</code>：設定長寬比為 16:9 橫幅<br>
               • <code>--v 6.0</code>：指定使用的 Midjourney 模型版本<br>
               • <code>--stylize 250</code>：控制 AI 藝術創作的風格化程度</p>
        </main>
